# Smart-HTTP git for the dev cluster. See Dockerfile for why this exists at all.
#
# Runs as uid 64199 on 8080 (a non-root process cannot bind 80; the Service maps 80 -> 8080).
# Everything it writes goes to /srv/git and /tmp, both emptyDirs, so the root filesystem is
# read-only.

server.modules = ( "mod_alias", "mod_cgi", "mod_setenv", "mod_accesslog" )

server.port          = 8080
server.document-root = "/srv/www"
server.upload-dirs   = ( "/tmp" )
index-file.names     = ( "index.cgi" )

# A push is a POST body of arbitrary size. Streaming it to the CGI rather than buffering it in
# upload-dirs keeps a large pack from filling /tmp before git ever sees it.
server.stream-request-body  = 2
server.stream-response-body = 2

# Every request on stdout, so `kubectl logs deploy/coder-git` is the record of what the coder
# cloned and pushed. fd 3, not 1: lighttpd points its own stdout at /dev/null when it starts, so
# "/dev/fd/1" is accepted and logs nothing. entrypoint.sh duplicates stdout onto fd 3 with `3>&1`.
accesslog.filename = "/dev/fd/3"

# GLOBAL, not inside the conditional below, and that is load-bearing: once the alias has been
# split into the backend's path plus PATH_INFO, the request's URL path is empty, the
# conditional no longer matches, and a cgi.assign declared inside it is silently gone - the
# request falls through to the static-file handler and answers 403 "pathinfo forbidden".
cgi.assign = (
    "/git-http-backend" => "",
    ".cgi"              => "/bin/sh",
)
setenv.set-environment = (
    "GIT_PROJECT_ROOT"    => "/srv/git",
    "GIT_HTTP_EXPORT_ALL" => "1",
)

# /Owner/repo.git/... and /repo.git/... go to git-http-backend; everything else is the listing.
$HTTP["url"] =~ "^/([^/]+/)?[^/]+\.git(/|$)" {
    alias.url = ( "/" => "/usr/libexec/git-core/git-http-backend/" )
}

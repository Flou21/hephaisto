# Tempo values for Hephaisto
# ---------------------------------------------------------------------------------------
#   chart:     grafana-community/tempo   (single binary)
#   version:   2.3.0   (Tempo 2.10.8)
#   release:   tempo
#   namespace: hephaisto-obs
#
#   NOTE ON THE REPO: this chart moved. `grafana/tempo` tops out at 1.24.4 (Tempo 2.9.0)
#   and is marked deprecated; maintenance moved to grafana-community after 2026-01-30.
#   Chart 2.3.0 exists ONLY in the new repo:
#     helm repo add grafana-community https://grafana-community.github.io/helm-charts
#
#   helm upgrade --install tempo grafana-community/tempo --version 2.3.0 \
#     -n hephaisto-obs -f infra/observability/tempo.values.yaml
#
# ---------------------------------------------------------------------------------------
# Why single binary and not tempo-distributed
# ---------------------------------------------------------------------------------------
# tempo-distributed defaults to replication_factor 3 across distributor/ingester/querier
# rings. On a single-node cluster that factor can never be satisfied. Tempo does start, and
# it mostly works, but on every pod restart the ring spends a period reporting instances as
# UNHEALTHY before the tokens are reclaimed, and it emits `tempo_ring_members{state="Unhealthy"}`
# along with error logs about failing to reach quorum.
#
# For a normal deployment that is transient noise a human ignores. For Hephaisto it is
# poison: the agent is being trained to treat every signal as real, and a recurring
# "ingester unhealthy" that resolves itself teaches it that ingester alerts are noise. The
# single binary has no ring to be unhealthy.
#
# ---------------------------------------------------------------------------------------
# Why a local-path PVC and not the rustfs S3 bucket
# ---------------------------------------------------------------------------------------
# rustfs (infra-storage, S3-compatible) is a toggleable resource in the neighbouring
# Tilt stack. Pointing Tempo's trace store at it makes the agent's durable evidence store
# depend on a checkbox in someone else's tilt_config.json. When rustfs is toggled off,
# Tempo would fail writes -- and traces are the SYSTEM OF RECORD here (Prometheus keeps
# 24h, the Aspire dashboard keeps nothing). A local PVC has no such dependency.
#
# ---------------------------------------------------------------------------------------
# external_labels.cluster MUST match everywhere
# ---------------------------------------------------------------------------------------
# The metrics-generator remote-writes `traces_spanmetrics_*` into Prometheus. Prometheus is
# configured with externalLabels.cluster: studio-rancher-desktop, and the OTel collector's
# `resource` processor stamps cluster=studio-rancher-desktop on everything it forwards.
#
# If the generator's registry.external_labels.cluster differs (or is absent), span metrics
# land with a different `cluster` label than everything else. Any query that joins or
# filters on `cluster` -- including the service-graph panels and the SLO rules -- then
# returns an empty vector. No error, no warning, just permanently silent alerts.
# ---------------------------------------------------------------------------------------

fullnameOverride: tempo

replicas: 1

tempo:
  repository: grafana/tempo
  # Pinned; matches chart 2.3.0's appVersion. Explicit so a repo update cannot move it.
  tag: "2.10.8"

  # Enables the streaming (gRPC-over-HTTP) search API. Grafana's Tempo datasource uses it
  # for `streamingEnabled.search` -- results appear as they are found instead of after the
  # whole block scan. On a small cluster it mostly matters because a long TraceQL search
  # otherwise looks like a hung query to whoever (or whatever) issued it.
  streamOverHttpEnabled: true

  multitenancyEnabled: false
  reportingEnabled: false

  # 48h, deliberately longer than Prometheus's 24h retention. When the agent investigates
  # an incident from yesterday, the metric that fired may already be gone; the trace that
  # explains it is still there.
  retention: 48h

  # -------------------------------------------------------------------------------------
  # Receivers
  # -------------------------------------------------------------------------------------
  # OTLP is the only protocol anything in this stack speaks -- the collector forwards
  # OTLP/gRPC on 4317.
  #
  # The Jaeger block below is NOT optional, however tempting it looks. Chart 2.3.0's
  # templates/service.yaml unconditionally includes the `tempo.udp` / `tempo.tcp` helpers,
  # and those dereference `.Values.tempo.receivers.jaeger.protocols.thrift_compact` etc.
  # with no `if`. Setting `jaeger: null` to drop the receivers therefore does not produce a
  # leaner Tempo -- it produces a hard template error:
  #
  #   executing "tempo.udp" at <.Values.tempo.receivers.jaeger.protocols.thrift_compact>:
  #   nil pointer evaluating interface {}.thrift_compact
  #
  # So the Jaeger listeners stay. They are unused, bound inside the pod, and reachable only
  # via the ClusterIP Service. Noted here so nobody spends an afternoon rediscovering it.
  # (Also note Helm MERGES maps: listing only `otlp:` would leave the chart's `jaeger:`
  # default in place regardless -- an explicit null is the only way to delete a map key,
  # and here that null is what breaks.)
  receivers:
    jaeger:
      protocols:
        grpc:
          endpoint: "0.0.0.0:14250"
        thrift_binary:
          endpoint: "0.0.0.0:6832"
        thrift_compact:
          endpoint: "0.0.0.0:6831"
        thrift_http:
          endpoint: "0.0.0.0:14268"
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  # -------------------------------------------------------------------------------------
  # Metrics generator
  # -------------------------------------------------------------------------------------
  # This is what turns spans into RED metrics (traces_spanmetrics_calls_total,
  # traces_spanmetrics_latency_bucket) and into service-graph edges
  # (traces_service_graph_request_total). The SLO rules in alerts/slo-rules.yaml are built
  # entirely on these, which is what makes them work for ANY traced service with zero
  # application code changes.
  metricsGenerator:
    enabled: true

    # Prometheus's remote-write receiver. Requires enableRemoteWriteReceiver: true in
    # kube-prometheus-stack.values.yaml -- see the TRAP #1 comment there. Verified service
    # name: the chart renders `<release>-kube-prometheus-prometheus`, release `hephaisto`.
    remoteWriteUrl: "http://hephaisto-kube-prometheus-prometheus.hephaisto-obs:9090/api/v1/write"

    # NOTE the singular key name: `processor`, not `processors`. This block CONFIGURES the
    # processors. It does NOT enable them -- see tempo.overrides.defaults below, which is
    # the switch that actually turns them on. Setting only one of the two is the most
    # common way to end up with a metrics-generator that runs and produces nothing.
    processor:
      span_metrics:
        # Emits `traces_target_info`, a per-service info series carrying the resource
        # attributes (k8s.namespace.name, k8s.pod.name, service.version, ...). Without it,
        # span metrics carry only span-level labels and cannot be joined back to a pod --
        # so the agent can see "service X is erroring" but not "in which pod".
        enable_target_info: true
        dimensions:
          - http.request.method
          - http.response.status_code
          - k8s.namespace.name
          - k8s.deployment.name
        histogram_buckets: [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.024, 2.048, 4.096]
      service_graphs:
        # How long to hold a client span waiting for its matching server span before giving
        # up and emitting a half-edge. 10s is the documented default and matches the
        # `serviceMap` expectations of the Grafana Tempo datasource.
        wait: 10s
        max_items: 10000
        dimensions:
          - k8s.namespace.name
      local_blocks:
        # Required for TraceQL metrics queries (rate/quantile_over_time over spans) to work
        # over anything older than the in-memory window. Without flush_to_storage, the
        # local-blocks processor keeps everything in RAM and TraceQL metrics silently only
        # cover the last few minutes.
        flush_to_storage: true
        max_block_duration: 1m
        filter_server_spans: false

    registry:
      collection_interval: 15s
      external_labels:
        # MUST equal prometheus.prometheusSpec.externalLabels.cluster and the OTel
        # collector's `resource` processor value. See the header comment.
        cluster: studio-rancher-desktop

    # Both of these default to /tmp, which on this StatefulSet is a separate emptyDir. Put
    # them on the PVC (mounted at /var/tempo) so a pod restart does not lose the generator's
    # write-ahead log and re-emit a burst of duplicate/out-of-order samples -- which is
    # exactly what Prometheus's 30m outOfOrderTimeWindow is there to absorb, but there is no
    # reason to lean on it every restart.
    storage:
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces

  # -------------------------------------------------------------------------------------
  # THE ACTIVATION SWITCH
  # -------------------------------------------------------------------------------------
  # metricsGenerator.enabled above starts the generator component. This per-tenant override
  # is what tells it which processors to RUN. They are two different config sections in
  # Tempo (`metrics_generator:` vs `overrides:`), and the chart exposes them as two
  # unrelated values keys. With `enabled: true` but no processors listed here, Tempo starts
  # a metrics-generator that receives every span and emits nothing at all.
  #
  # Note the naming mismatch that makes this easy to get wrong: the processor NAMES here
  # are hyphenated (`span-metrics`) while the config keys above are underscored
  # (`span_metrics`). Both spellings are correct in their own place.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks
        # Keep the generator from being throttled by the default per-tenant series cap when
        # the C10 fixture is generating traffic across four endpoints.
        max_active_series: 50000

  ingester:
    # Flush aggressively. In a dev loop, "the trace is not searchable yet" reads as data
    # loss. Production would use much longer values to get better block compaction.
    trace_idle_period: 10s
    max_block_duration: 5m
    flush_check_period: 10s

  querier:
    max_concurrent_queries: 10

  server:
    http_listen_port: 3200

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

# ---------------------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------------------
persistence:
  enabled: true
  # NOTE: this chart's key is `storageClassName` (long form). The Loki chart's equivalent
  # key is `storageClass` (short form). They are not interchangeable and a wrong one is
  # silently ignored, leaving the PVC on the default class.
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# tempo-query is the Jaeger-UI shim. Grafana talks TraceQL to Tempo directly; this would be
# a second, worse trace UI to keep alive.
tempoQuery:
  enabled: false

serviceAccount:
  create: true

service:
  type: ClusterIP

serviceMonitor:
  enabled: true
  additionalLabels:
    # Must match serviceMonitorSelector in kube-prometheus-stack.values.yaml. This is how
    # observability-selfcheck.yaml can see tempo_distributor_spans_received_total.
    release: hephaisto

# No Ingress. Access via Tilt port-forward on the Tailscale interface.
ingress:
  enabled: false

# grafana-mcp values for Hephaisto
# ---------------------------------------------------------------------------------------
#   chart:     grafana-community/grafana-mcp
#   version:   0.19.0
#   image:     grafana/mcp-grafana:1.1.0   (pinned below, see note)
#   release:   grafana-mcp
#   namespace: hephaisto-obs
#
#   REPO NOTE: this chart is NOT in the `grafana` repo -- `grafana/grafana-mcp` tops out at
#   0.3.1. It lives in the community repo:
#     helm repo add grafana-community https://grafana-community.github.io/helm-charts
#
#   helm upgrade --install grafana-mcp grafana-community/grafana-mcp --version 0.19.0 \
#     -n hephaisto-obs -f infra/observability/grafana-mcp.values.yaml
#
# VERSION NOTE: chart 0.19.0's appVersion is 1.0.0, but the image is pinned to 1.1.0 below
# (which is chart 0.20.0's appVersion). Chart 0.19.0 is used because that is the version
# already proven on this machine by the neighbouring stack's release; the image is bumped because
# 1.1.0 is the current server. If the chart's templates ever stop matching the 1.1.0 flag
# set, move the chart to 0.20.0 rather than downgrading the image.
#
# ---------------------------------------------------------------------------------------
# What this is for
# ---------------------------------------------------------------------------------------
# This is the agent's HANDS on the observability stack. Hephaisto does not scrape
# Prometheus or Loki directly; it calls MCP tools that do, so that every query the agent
# runs is a discrete, logged, schema-checked tool call rather than a free-text HTTP request
# it composed itself. The tool boundary is what makes the investigation auditable and what
# makes `hephaisto_tool_calls_total{tool=...}` meaningful.
#
# It talks to Grafana, and Grafana proxies to Prometheus/Loki/Tempo/Alertmanager using the
# datasource UIDs provisioned in grafana-datasources.yaml. So the agent inherits exactly the
# datasources declared there -- no separate credential plumbing per backend.
# ---------------------------------------------------------------------------------------

fullnameOverride: grafana-mcp

replicas: 1

image:
  registry: docker.io
  repository: grafana/mcp-grafana
  tag: "1.1.0"
  pullPolicy: IfNotPresent

grafana:
  # Verified service name from the kube-prometheus-stack render: `hephaisto-grafana`,
  # port 80 (grafana.service.port). Note this is port 80, not Grafana's usual 3000 -- the
  # Service remaps it, and using :3000 here yields connection refused.
  url: "http://hephaisto-grafana.hephaisto-obs:80"
  # Grafana service-account token, created out of band and stored in this Secret. The chart
  # wires it into GRAFANA_SERVICE_ACCOUNT_TOKEN.
  #
  #   kubectl -n hephaisto-obs create secret generic grafana-mcp-grafana-token \
  #     --from-literal=token=glsa_xxxxx
  #
  # It is NOT in git and NOT generated by this chart, deliberately: a token committed to a
  # values file is a token in every clone and every `helm get values` forever.
  apiKeySecret:
    name: grafana-mcp-grafana-token
    key: token

# ---------------------------------------------------------------------------------------
# Transport and inbound auth
# ---------------------------------------------------------------------------------------
extraArgs:
  # streamable-http, not stdio and not the deprecated SSE transport. stdio would require
  # the agent to fork this binary as a child process; streamable-http lets it be an
  # independently scheduled, independently restartable pod that the agent reaches over the
  # cluster network -- which is also what makes its own metrics and logs observable.
  - "--transport=streamable-http"
  - "--address=0.0.0.0:8000"
  # The Host header allowlist. The agent reaches this by ClusterIP service name; `*` avoids
  # a class of failure where a correct request is rejected for a cosmetic reason. The
  # Service is ClusterIP-only, so nothing off-cluster can present any Host at all.
  - "--allowed-hosts=*"
  - "--log-level=info"

envValueFrom:
  # === Bearer-gated ===================================================================
  # MCP_GRAFANA_SERVER_TOKEN makes the MCP server require `Authorization: Bearer <token>`
  # on every inbound call. Unlike Alertmanager's webhook (which physically cannot send a
  # header -- see kube-prometheus-stack.values.yaml), the agent is our own code and can, so
  # this endpoint IS token-gated rather than relying on network policy alone.
  #
  # The same Secret is mounted into the agent Deployment as Grafana__ServiceAccountToken.
  # Create it once:
  #   kubectl -n hephaisto-obs create secret generic grafana-mcp-caller-token \
  #     --from-literal=token=$(openssl rand -hex 32)
  #   kubectl -n hephaisto     create secret generic grafana-mcp-caller-token \
  #     --from-literal=token=<same value>
  MCP_GRAFANA_SERVER_TOKEN:
    secretKeyRef:
      name: grafana-mcp-caller-token
      key: token

# ---------------------------------------------------------------------------------------
# Tool surface
# ---------------------------------------------------------------------------------------
# disableWrite left FALSE. That is a considered decision, not an oversight: the agent
# annotates dashboards (see the annotation tools below), and annotations are writes. The
# write surface Grafana exposes through this token is dashboards/annotations only -- it
# cannot touch the cluster. Cluster mutation goes through the Kubernetes API under the
# deliberately narrow RBAC in infra/app/rbac.yaml, never through here.
disableWrite: false

# Categories turned off. Each becomes `--disable-<category>`.
disabledCategories:
  # All four of these are Grafana Cloud products. Against a local OSS Grafana their tools
  # exist in the MCP tool list but every call returns a 404 from an endpoint that is not
  # there. That matters more for an LLM than for a human: a tool that is offered and always
  # fails teaches the model to retry it, burning tokens and investigation steps on a dead
  # end. Removing them from the list removes the temptation.
  - oncall
  - incident
  - asserts
  - sift
  # Pyroscope is not deployed in this stack either.
  - pyroscope

# ---------------------------------------------------------------------------------------
# DELIBERATELY *NOT* DISABLED -- and this differs from the LiteLLM-facing copy
# ---------------------------------------------------------------------------------------
# The grafana-mcp release in the neighbouring workspace fronts LiteLLM for interactive
# chat, and its allowlist excludes alert-rule tools, annotation tools and Tempo tools. That
# is correct THERE: a human asking "why is the segment count low" does not need to enumerate
# alert rules, and letting a chat assistant write annotations onto shared dashboards is
# noise at best.
#
# Here all three are load-bearing, and disabling them would quietly remove the agent's
# ability to do its job:
#
#   * ALERT RULE tools -- the agent receives an Alertmanager webhook containing an alert
#     name and labels. To reason about it, it must fetch the RULE: the actual PromQL, the
#     `for:` duration, the severity and the annotations that say what the alert means. An
#     agent that can see an alert fired but not what the alert measures is reduced to
#     pattern-matching on the name.
#
#   * ANNOTATION tools -- this is the agent's write-back channel to humans. Every incident
#     it opens and every action it takes gets annotated onto the dashboard timeline, so a
#     human scrubbing back through last night sees "agent restarted c2-crashloop here"
#     inline with the graphs. Without it, the agent's reasoning lives only in its own
#     Postgres and the human sees an unexplained discontinuity.
#
#   * TEMPO / TraceQL tools -- traces are the durable system of record in this stack (48h,
#     vs 24h of metrics). The five-hop correlation the whole design is built around --
#     alert -> metric -> exemplar -> trace -> log -- has Tempo as its middle hop. Disabling
#     Tempo tools does not degrade the agent gracefully; it severs the chain.
#
# If someone copies that values file over this one to "keep them consistent", that is
# the bug this comment exists to prevent.

debug: false

metrics:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 8000

serviceAccount:
  create: true
  automountServiceAccountToken: false

# The MCP server needs no Kubernetes API access whatsoever. Its only outbound dependency is
# Grafana's HTTP API.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

securityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

ingress:
  enabled: false

route:
  main:
    enabled: false

hpa:
  enabled: false

# A stand-in for Microsoft Teams, as the bot sees it - for the model, as the pager suite needs
# it - and for GitHub, as the issue poller sees it (the Service github-stand-in, below).
#
# Applied by Tilt when tilt_config.json says "teams-bot": "stand-in" or "github": "stand-in", and
# never by the chart. It is the notification receiver's binary (see
# infra/e2e/notification-receiver/TeamsStandIn.cs): it answers the token request and the Bot
# Connector calls, keeps every message it is given, and serves what a person looking at Teams
# would see now on GET /teams/messages.
#
# It exists so the board and the alerts can be exercised on this cluster without a tenant, and
# without a test run editing a channel real people read. What it copies from Teams are the two
# behaviours the agent's design rests on: an id has to arrive percent-encoded, and a DELETE is
# refused and counted - the count being zero is the assertion.
#
# In hephaisto-obs beside the notification receiver, for that receiver's reason: nothing here
# is meant to break. Single replica, in-memory, Recreate: two pods would split the messages.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-stand-in
  namespace: hephaisto-obs
  labels:
    app.kubernetes.io/name: teams-stand-in
    app.kubernetes.io/part-of: hephaisto-e2e
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: teams-stand-in
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teams-stand-in
    spec:
      containers:
        - name: receiver
          image: hephaisto/notification-receiver:dev
          # Built into this node's docker by Tilt. Never pulls.
          imagePullPolicy: IfNotPresent
          env:
            # Who is "in the team". values-dev-teams-bot.yaml names one of these as a
            # recipient and one address that is not here, so both paths run. The pager suite
            # routes to all three: oncall@ by label, dev@ as the fallback, lead@ as a step.
            - name: TEAMS_MEMBERS
              value: "oncall@example.com,dev@example.com,lead@example.com"
            # The ids values-dev-teams-bot.yaml gives the bot, and where a signed click is
            # delivered: POST /teams/click builds one and posts it to the agent's actions port.
            - name: TEAMS_APP_ID
              value: "00000000-0000-0000-0000-0000000000d2"
            - name: TEAMS_TENANT_ID
              value: "00000000-0000-0000-0000-0000000000d1"
            - name: AGENT_ACTIONS_URL
              value: "http://hephaisto.hephaisto:8082/api/teams/messages"
            # GitHub (GitHubStandIn.cs). The token is not a credential - it opens nothing but
            # this pod's /github/api - and the bot is the account an issue is assigned to. Whoever
            # points an agent at this names the same three: the token in its Secret, the login it
            # polls for, and - for an approver - a number the issues suite comments as
            # (scripts/e2e/lib/issues.sh).
            - name: GITHUB_STANDIN_TOKEN
              value: "stand-in-github-token"
            - name: GITHUB_STANDIN_BOT_LOGIN
              value: "hephaisto-bot"
            - name: GITHUB_STANDIN_BOT_ID
              value: "9001"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # The model stand-in keeps the last 500 prompts it was sent, for the pager suite
              # to read back; the GitHub one the last 2000 requests, a few hundred bytes each.
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: teams-stand-in
  namespace: hephaisto-obs
  labels:
    app.kubernetes.io/name: teams-stand-in
spec:
  selector:
    app.kubernetes.io/name: teams-stand-in
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The same pod, as the model. The pager suite points Llm__Endpoint here
# (scripts/e2e/values-pager.yaml); a name of its own so that reads as what it is.
apiVersion: v1
kind: Service
metadata:
  name: model-stand-in
  namespace: hephaisto-obs
  labels:
    app.kubernetes.io/name: model-stand-in
spec:
  selector:
    app.kubernetes.io/name: teams-stand-in
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The same pod, as GitHub. An agent's GitHub API base URL is
# http://github-stand-in.hephaisto-obs:8080/github/api; a name of its own for the model's reason,
# and so that the one line which decides whether a dev agent talks to github.com says so.
apiVersion: v1
kind: Service
metadata:
  name: github-stand-in
  namespace: hephaisto-obs
  labels:
    app.kubernetes.io/name: github-stand-in
spec:
  selector:
    app.kubernetes.io/name: teams-stand-in
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Not a credential. The stand-in accepts any client secret that is not empty, and the chart
# refuses to render the bot without a Secret to name. Its own name, so that switching
# "teams-bot" to "real" can never be answered with this one.
apiVersion: v1
kind: Secret
metadata:
  name: hephaisto-notification-teams-bot-stand-in
  namespace: hephaisto
  labels:
    app.kubernetes.io/part-of: hephaisto-e2e
type: Opaque
stringData:
  clientSecret: stand-in-accepts-anything

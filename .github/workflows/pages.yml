name: pages

# Publishes website/ and nothing else.
#
# Separate from ci.yml on purpose. That file states in its own header that it holds no deploy
# job, no kubeconfig and no cluster credential, and that rule is worth more than the
# convenience of one fewer workflow. This is not the kind of deploy that rule is about: it
# copies static files to a CDN, cannot reach a cluster, and holds no credential of its own -
# the Pages token is minted per run by OIDC. Keeping it in its own file is what makes that
# distinction legible instead of requiring a reader to work it out from the permissions block.
#
# One thing this cannot do for you: Settings -> Pages -> Source must be set to "GitHub
# Actions" once, by hand. Nothing in the repository can set it, and until it is, this job
# fails at configure-pages with a 404.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates by OIDC and 403s without this. It is not the default.
  id-token: write

# NOT cancel-in-progress, unlike ci.yml. A superseded test run is waste; a cancelled deploy can
# leave the site mid-swap. Two pushes a minute apart are not worth that risk.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # There is no build step. The site is hand-written HTML consuming the same tokens.css the
      # console does, and the fonts are self-hosted in the repo - so what is committed is what
      # is served. If a toolchain ever appears it goes here, and the visual job in ci.yml has
      # to start testing its output rather than the source.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - id: deploy
        uses: actions/deploy-pages@v5

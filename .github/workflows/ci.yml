name: ci

on:
  pull_request:
  push:
    branches: [main]

# There is deliberately NO deploy job in this file, and there must not be one. This workflow
# holds no kubeconfig and no cluster credential. It publishes versions that no deployed chart
# references; a cluster moves only when a human changes a pinned version in a GitOps repo.
# The gap between "CI is green" and "the cluster changed" is where a person decides, and the
# thing this repo deploys can delete pods. The kind cluster below is a throwaway test fixture
# that dies with the runner, not a deployment target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # The Kubernetes API surface the chart is validated against, and the kind node image the
  # e2e harness boots. ONE number, because a chart validated against an API version nobody
  # runs is a deprecation that reaches production without CI noticing. Kept close to what is
  # actually deployed - the dev cluster runs v1.36.2+k3s1 - rather than to whatever was
  # current when this file was written. kind ships node images for 1.34-1.37 only.
  K8S_VERSION: 1.36.4

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.minver.outputs.version }}
      semver: ${{ steps.minver.outputs.semver }}
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer reads git. A shallow clone with no tags makes every build 0.0.0-alpha.0,
          # silently, and the image tag then bears no relation to the commit.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - id: minver
        run: |
          dotnet tool restore
          # `-p main.0` is NOT optional. minver-cli defaults to alpha.0 while this repo's
          # Directory.Build.props says main.0, so without it the CLI and the compiler disagree
          # about what this very commit is called - and the image tag stops matching the
          # assembly inside it.
          # ...and `-m` is not optional either, for the identical reason: the CLI does not read
          # Directory.Build.props, so MinVerMinimumMajorMinor is invisible to it. Read out of
          # the props file rather than hardcoded, so bumping the floor for a milestone cannot
          # leave this line behind.
          M=$(sed -n 's:.*<MinVerMinimumMajorMinor>\(.*\)</MinVerMinimumMajorMinor>.*:\1:p' \
                Directory.Build.props | head -1)
          V=$(dotnet minver -t v -p main.0 ${M:+-m "$M"})
          # Strip +metadata before anything sees it: OCI tags cannot contain '+', and Helm
          # silently rewrites it to '_', so Chart.yaml would say 0.0.1+abc while the OCI tag
          # is 0.0.1_abc and Argo cannot find the version it was told to install.
          echo "version=$V"        >> "$GITHUB_OUTPUT"
          echo "semver=${V%%+*}"   >> "$GITHUB_OUTPUT"
          echo "MinVer: $V (semver ${V%%+*})" >> "$GITHUB_STEP_SUMMARY"

  dotnet-test:
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # An explicit cache rather than setup-dotnet's: that one keys on lock files, and this
      # repo has none.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror

      # NEVER `dotnet test`. On this toolchain it either hard-errors or launches the test
      # executable in server mode and exits in ~200ms reporting "Zero tests ran" - with exit
      # code 0. A xunit.v3 project is an executable; run it.
      #
      # ci-test.sh adds the floor: it parses the actual count out of the summary and fails if
      # too few ran, because exiting 0 having tested nothing is a failure mode this repo has
      # already hit. (The obvious `--minimum-expected-tests` flag does NOT exist in this
      # runner - it prints `unknown option` and still exits 0, which is the same trap wearing
      # a different hat.)
      - name: Run tests
        run: scripts/ci-test.sh tests/Hephaisto.Tests/Hephaisto.Tests.csproj 1750 Release

  integration-postgres:
    runs-on: ubuntu-latest
    env:
      # Read by BOTH the CREATE ROLE below and AuditImmutabilityTests, which connects as this
      # role to prove Postgres refuses an UPDATE on audit_events. Two literals that had to
      # agree and did not is what kept this job red.
      HEPHAISTO_APP_PASSWORD: ci-not-a-real-password
    # The highest-value job here. It closes the only structural gap in an otherwise
    # well-tested repo: Hephaisto.Core is I/O-free by design, so the persistence bugs live in
    # exactly the layer the unit suite cannot reach. Five separate change-detection bugs
    # shipped before this existed.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hephaisto
          POSTGRES_PASSWORD: hephaisto
          POSTGRES_DB: hephaisto
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hephaisto -d hephaisto"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The role must exist BEFORE the migration runs. The migration's GRANT/REVOKE block is
      # wrapped in `IF EXISTS (SELECT 1 FROM pg_roles ...)` and silently no-ops without it -
      # so the audit-immutability test would pass while testing nothing at all.
      - name: Create the hephaisto_app role
        run: |
          PGPASSWORD=hephaisto psql -h localhost -U hephaisto -d hephaisto -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='hephaisto_app')
             THEN CREATE ROLE hephaisto_app LOGIN PASSWORD '$HEPHAISTO_APP_PASSWORD'; END IF; END \$\$;"

      - name: Apply migrations
        env:
          ConnectionStrings__hephaisto: Host=localhost;Port=5432;Database=hephaisto;Username=hephaisto;Password=hephaisto
        run: |
          dotnet tool restore
          # `dotnet ef` builds the project, and a build needs a restore first. Without this
          # the step dies on NETSDK1004 (no project.assets.json) - which reads like a broken
          # SDK rather than a missing step, because `dotnet tool restore` succeeded just above
          # and looks like it restored something relevant. It did not: tools, not packages.
          dotnet restore
          dotnet ef database update --project src/Hephaisto.Agent --context HephaistoDbContext

      - name: Run the integration suite
        env:
          # The fixture THROWS rather than skipping when this is unset. A silently skipped
          # database suite is indistinguishable from a passing one.
          ConnectionStrings__hephaisto: Host=localhost;Port=5432;Database=hephaisto;Username=hephaisto;Password=hephaisto
        run: scripts/ci-test.sh tests/Hephaisto.IntegrationTests/Hephaisto.IntegrationTests.csproj 140 Release

  chart:
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/

      - run: helm lint charts/hephaisto --strict --values charts/hephaisto/ci/full-values.yaml

      # Rendered under HELM 3 specifically. Argo and Flux both embed Helm 3, so a chart that
      # only renders under Helm 4 would install fine from a laptop and fail in the pipeline it
      # was built for.
      - name: Render and validate every values combination
        run: |
          set -euo pipefail
          # Space-separated entries layer several files, the way the Tiltfile does: the dev
          # overlays (coder, local model) are never installed alone.
          for values in ci/minimal-values.yaml ci/full-values.yaml values-dev.yaml \
                        "values-dev.yaml values-dev-coder.yaml values-dev-local-llm.yaml"; do
            echo "::group::$values"
            args=()
            for f in $values; do args+=(--values "charts/hephaisto/$f"); done
            helm template hephaisto charts/hephaisto \
              --namespace hephaisto \
              "${args[@]}" \
              --set codeFix.mode=plan --set codeFix.sdk=fake \
            | kubeconform -strict -summary -verbose \
                -kubernetes-version ${{ env.K8S_VERSION }} \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
        # Without the CRDs-catalog location kubeconform SKIPS PodMonitor and PrometheusRule
        # entirely - and reports success - so it would validate everything except the two
        # objects most likely to be wrong.

      # The safety properties from the chart's design, as executable assertions. This is what
      # stops them rotting into comments.
      - run: charts/hephaisto/ci/negative-tests.sh

      - name: Package with the computed version
        run: |
          helm package charts/hephaisto \
            --version "${{ needs.version.outputs.semver }}" \
            --app-version "${{ needs.version.outputs.semver }}" \
            --destination /tmp/chart
          ls -l /tmp/chart

      # Handed to e2e-kind so that job installs the ARTIFACT A CONSUMER GETS, not the source
      # directory. Those differ in exactly the way that matters here: Chart.yaml stays 0.0.0
      # in git on purpose, and only `helm package --app-version` stamps the real number in.
      - uses: actions/upload-artifact@v7
        with:
          name: chart-package
          path: /tmp/chart/*.tgz
          retention-days: 1

  image:
    runs-on: ${{ matrix.runner }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          # arm64 on a NATIVE arm runner, never under QEMU: a .NET publish under emulation
          # takes 10-25 minutes and is flaky. arm runners are free on public repos.
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@v4

      # PRs build but do not push. The point is to know the image still builds - which is not
      # hypothetical: this Dockerfile had never been built at all until it was tried, and it
      # failed at `RUN adduser` because the aspnet base ships neither adduser nor useradd.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            VERSION=${{ needs.version.outputs.semver }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  # The code-fix runner (coder/): a TypeScript program and its own image, run by a Kubernetes
  # Job. Built without pushing, then its whole test suite runs INSIDE that image - read-only
  # root, uid 64198, exactly as a Job runs it - because the image is what ships, and a suite
  # that passes on a runner's Node but not in the image tested nothing. No model and no GitHub
  # token: the fake SDK, a bare git remote, the gh shim, and the real SDK + pinned CLI against a
  # localhost mock of the Messages API with a dummy key. scripts/test.sh enforces its own
  # test-count floor.
  coder:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: coder
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: hephaisto/coder:ci
          cache-from: type=gha,scope=coder-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=coder-${{ matrix.platform }}

      - name: Test inside the image
        run: coder/scripts/test.sh --in-image hephaisto/coder:ci

  e2e-kind:
    runs-on: ubuntu-latest
    needs: [version, chart]
    # HONEST LIMITS, so nobody reads more into a green tick than is there:
    #
    #   - kind's default CNI ACCEPTS NetworkPolicy objects and does not enforce them. This job
    #     validates their shape, not their effect - and their effect is the Alertmanager
    #     webhook's entire protection when no webhook token is set. That stays a manual
    #     acceptance step.
    #   - No Prometheus here, so the `release:` selector is only covered by the render-time
    #     grep in the chart job.
    #   - No real LLM key, so nothing exercises an investigation end to end.
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - uses: actions/download-artifact@v8
        with:
          name: chart-package
          path: /tmp/chart

      - uses: helm/kind-action@v1
        with:
          cluster_name: hephaisto-e2e

      # The three CRDs the chart needs, not the whole kube-prometheus-stack: that takes 5+
      # minutes and is the flakiest thing that could be in this job.
      - name: Install the Prometheus Operator CRDs
        run: |
          BASE=https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.78.2/example/prometheus-operator-crd
          for crd in monitoring.coreos.com_podmonitors monitoring.coreos.com_prometheusrules monitoring.coreos.com_prometheuses; do
            kubectl apply --server-side -f "$BASE/${crd}.yaml"
          done

      - name: Create the namespaces and dummy secrets
        run: |
          kubectl create namespace hephaisto
          kubectl create namespace hephaisto-chaos
          kubectl create namespace hephaisto-obs
          kubectl -n hephaisto create secret generic hephaisto-postgres \
            --from-literal=POSTGRES_USER=hephaisto \
            --from-literal=POSTGRES_PASSWORD=ci-not-a-real-password \
            --from-literal=POSTGRES_DB=hephaisto
          kubectl -n hephaisto create secret generic hephaisto-llm \
            --from-literal=GEMINI_API_KEY=ci-not-a-real-key

      # Built through buildx against the SAME gha cache scope the `image` job writes, rather
      # than a plain `docker build` that starts cold every time. This was 45 seconds of a
      # 2m11s job - more than half the setup - and on any commit that does not touch the
      # application source it is now a cache hit measured in seconds.
      #
      # Deliberately NOT `needs: [image]` with an artifact handoff, which looks like the
      # tidier way to avoid a second build and is slower: this job runs in PARALLEL with the
      # image matrix today, and waiting for it would serialise ~1m of build in front of ~1m25
      # of cluster work. Sharing a cache keeps both running at once.
      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: hephaisto/agent:e2e
          # Into the runner's docker daemon, so `kind load docker-image` can find it.
          load: true
          build-args: |
            VERSION=${{ needs.version.outputs.semver }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=linux/amd64

      - name: Load the image into kind
        run: kind load docker-image hephaisto/agent:e2e --name hephaisto-e2e

      - name: helm install
        run: |
          helm install hephaisto \
            "/tmp/chart/hephaisto-${{ needs.version.outputs.semver }}.tgz" \
            --namespace hephaisto \
            --set image.repository=hephaisto/agent \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set postgres.embedded.enabled=true \
            --set 'policy.actionableNamespaces[0]=hephaisto-chaos' \
            --set cluster.name=hephaisto-e2e \
            --set prometheusOperator.selectorLabels.release=kube-prometheus-stack \
            --set codeFix.enabled=true \
            --set codeFix.mode=plan \
            --set codeFix.createNamespace=true \
            --set codeFix.image.repository=example.invalid/hephaisto-coder-placeholder \
            --set codeFix.image.tag=never-pulled \
            --set secrets.codeFix=hephaisto-codefix-not-created \
            --wait --timeout 6m
          # codeFix is ON here, in mode plan, so the one Role that grants `create jobs` is
          # installed and the RBAC step below can prove it is exactly one namespace wide. The
          # image is a placeholder nothing ever pulls: no repository is mapped, so no coder Job
          # can start. The egress proxy IS real, and --wait holding for it is the only place CI
          # proves the rendered squid config starts under the restricted Pod Security profile.

      # The most important prose in the repo, turned into an enforced test. Only a live API
      # server can answer these.
      - name: RBAC is actually bounded
        run: |
          set -euo pipefail
          SA=system:serviceaccount:hephaisto:hephaisto
          fail=0
          must_not() {
            if kubectl auth can-i $1 --as="$SA" ${2:-} >/dev/null 2>&1; then
              echo "::error::the agent CAN $1 ${2:-} and must not"; fail=1
            else
              echo "ok: cannot $1 ${2:-}"
            fi
          }
          must_not "get secrets" "-A"
          must_not "delete secrets" "-A"
          must_not "delete pods" "-n kube-system"
          must_not "create clusterrolebindings"
          must_not "delete pods" "-n hephaisto"

          if kubectl auth can-i delete pods -n hephaisto-chaos --as="$SA" >/dev/null 2>&1; then
            echo "ok: can delete pods in hephaisto-chaos"
          else
            echo "::error::the agent cannot act in its one allowed namespace"; fail=1
          fi

          # Code fixes: `create jobs` in the coder namespace and NOWHERE else. Each "must" is the
          # positive control for the refusals after it - without them, a chart that granted
          # nothing at all would pass every must_not.
          must() {
            if kubectl auth can-i $1 --as="$SA" ${2:-} >/dev/null 2>&1; then
              echo "ok: can $1 ${2:-}"
            else
              echo "::error::the agent cannot $1 ${2:-} and needs to"; fail=1
            fi
          }
          for verb in create get list watch delete; do
            must "$verb jobs" "-n hephaisto-coder"
          done
          must "create configmaps" "-n hephaisto-coder"
          must "get pods/log" "-n hephaisto-coder"

          must_not "create jobs" "-n hephaisto"
          must_not "create jobs" "-n hephaisto-chaos"
          must_not "create jobs" "-n kube-system"
          must_not "create jobs" "-A"
          must_not "create cronjobs" "-n hephaisto-coder"
          must_not "create pods" "-A"
          must_not "create pods" "-n hephaisto-coder"
          must_not "get secrets" "-n hephaisto-coder"
          must_not "create secrets" "-A"

          # The coder's own identity can do nothing at all.
          CODER=system:serviceaccount:hephaisto-coder:hephaisto-coder
          for probe in "get pods -n hephaisto-coder" "get secrets -n hephaisto-coder" \
                       "create jobs -n hephaisto-coder" "get pods -A" "list configmaps -A"; do
            if kubectl auth can-i $probe --as="$CODER" >/dev/null 2>&1; then
              echo "::error::the coder ServiceAccount CAN $probe and must be bound to nothing"; fail=1
            else
              echo "ok: the coder cannot $probe"
            fi
          done
          exit $fail


      # The MCP endpoint is off unless asked for (#157): an install that never mentioned it has no
      # port for it, and /mcp answers like any path that does not exist.
      - name: The MCP endpoint is off by default
        run: |
          set -euo pipefail
          ports=$(kubectl -n hephaisto get svc hephaisto -o jsonpath='{.spec.ports[*].port}')
          case " $ports " in *" 8083 "*) echo "::error::the Service has the MCP port without mcp.enabled"; exit 1 ;; esac
          kubectl -n hephaisto port-forward svc/hephaisto 18181:8080 >/tmp/pf-mcp-off.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:18181/healthz >/dev/null && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:18181/mcp -H 'Content-Type: application/json' --data '{}')
          [ "$code" = 404 ] || { echo "::error::/mcp answered $code with the endpoint off"; exit 1; }
          echo "ok: no MCP port on the Service, and /mcp is 404"
      - name: The published image runs read-only and non-root
        run: |
          set -euo pipefail
          POD=$(kubectl -n hephaisto get pod -l app.kubernetes.io/name=hephaisto -o name | head -1)
          # readOnlyRootFilesystem has never been exercised anywhere else: the dev cluster runs
          # the dev image, which is `dotnet watch` and needs a writable filesystem. CI is the
          # first thing that ever runs the production image under it.
          kubectl -n hephaisto get "$POD" -o jsonpath='{.spec.containers[0].securityContext}' | tee /dev/stderr | grep -q '"readOnlyRootFilesystem":true'
          kubectl -n hephaisto get "$POD" -o jsonpath='{.spec.securityContext.runAsUser}' | grep -q '^64198$'
          kubectl -n hephaisto wait --for=condition=Ready "$POD" --timeout=120s

      - name: The coder egress proxy starts and refuses what it must
        run: |
          set -euo pipefail
          kubectl -n hephaisto-coder rollout status deploy/hephaisto-coder-egress --timeout=120s
          # From a pod labelled as a coder: current kindnet DOES enforce NetworkPolicy, and the
          # proxy admits only coder pods, so an unlabelled probe never reaches squid at all (curl
          # reports 000, which is the policy working, not squid). The sleep covers the moment in
          # which a new pod's IP is not yet in the policy's allow set. Pod Security `restricted` is
          # enforced there, so the probe pod has to comply too.
          kubectl -n hephaisto-coder run proxy-probe --restart=Never --labels=app.kubernetes.io/name=hephaisto-coder --image=curlimages/curl:8.16.0 \
            --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":100,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"proxy-probe","image":"curlimages/curl:8.16.0","command":["sh","-c","sleep 5; for u in https://example.com/ https://github.com:22/; do curl -s -o /dev/null -m 20 -w \"%{http_connect} $u\\n\" -x http://hephaisto-coder-egress:3128 $u || true; done"],"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}'
          kubectl -n hephaisto-coder wait --for=jsonpath='{.status.phase}'=Succeeded pod/proxy-probe --timeout=120s
          kubectl -n hephaisto-coder logs pod/proxy-probe | tee /tmp/probe.txt
          # Both must be refused at the CONNECT: a host not on the list, and an allowed host on a
          # port that is not 443.
          [ "$(grep -c '^403 ' /tmp/probe.txt)" -eq 2 ] || { echo "::error::the egress proxy did not refuse both probes"; exit 1; }
          kubectl -n hephaisto-coder logs deploy/hephaisto-coder-egress | grep -c TCP_DENIED

      # git tag -> MinVer -> MSBuild -> image -> chart appVersion -> /api/version, asserted end
      # to end. Every link in that chain has a way of quietly reporting something else.
      - name: The version chain holds end to end
        run: |
          set -euo pipefail
          EXPECTED='${{ needs.version.outputs.semver }}'
          kubectl -n hephaisto port-forward svc/hephaisto 18080:8080 &
          for i in $(seq 1 30); do
            sleep 2
            curl -sf localhost:18080/api/version > /tmp/version.json && break
          done
          cat /tmp/version.json
          ACTUAL=$(jq -r .version /tmp/version.json)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::/api/version says $ACTUAL, expected $EXPECTED"; exit 1; }
          CHART=$(helm -n hephaisto get metadata hephaisto -o json | jq -r .appVersion)
          [ "$CHART" = "$EXPECTED" ] || { echo "::error::chart appVersion is $CHART, expected $EXPECTED"; exit 1; }
          echo "version chain holds: $EXPECTED"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n hephaisto get all
          kubectl -n hephaisto describe pods
          kubectl -n hephaisto logs -l app.kubernetes.io/name=hephaisto --tail=200 --all-containers || true

  # The pager suite (scripts/e2e/pager.sh): is Hephaisto a pager a person can rely on?
  #
  # Alerts go through a real Alertmanager - or straight to the webhook - into the installed chart,
  # and the assertions are about what a person would have seen: which incidents exist, in which
  # state, which Teams messages were sent and edited, what the model was asked. The model and
  # Teams are the stand-in (infra/e2e/notification-receiver), so this is deterministic and free.
  #
  # A scenario may land before the code that turns it green: scripts/e2e/pager/KNOWN_RED lists
  # those, a red one there does not fail this job, and a GREEN one there does.
  #
  # HONEST LIMITS: no Prometheus, so P16 (the agent's own absence, told by a path the agent is
  # not on) is skipped here and runs on the dev cluster and in the release harness. The windows
  # are seconds where production's are hours - the suite relies on their order, not their size.
  e2e-pager:
    runs-on: ubuntu-latest
    needs: [version, chart]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - uses: actions/download-artifact@v8
        with:
          name: chart-package
          path: /tmp/chart

      - uses: helm/kind-action@v1
        with:
          cluster_name: hephaisto-e2e

      - name: Install the Prometheus Operator CRDs
        run: |
          BASE=https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.78.2/example/prometheus-operator-crd
          for crd in monitoring.coreos.com_podmonitors monitoring.coreos.com_prometheusrules monitoring.coreos.com_prometheuses; do
            kubectl apply --server-side -f "$BASE/${crd}.yaml"
          done

      - name: Create the namespaces and dummy secrets
        run: |
          kubectl create namespace hephaisto
          kubectl create namespace hephaisto-chaos
          kubectl create namespace hephaisto-obs
          kubectl -n hephaisto create secret generic hephaisto-postgres \
            --from-literal=POSTGRES_USER=hephaisto \
            --from-literal=POSTGRES_PASSWORD=ci-not-a-real-password \
            --from-literal=POSTGRES_DB=hephaisto
          kubectl -n hephaisto create secret generic hephaisto-llm \
            --from-literal=LLM_API_KEY=the-stand-in-accepts-anything
          # The webhook's bearer token (#138), in the agent's namespace for the chart and in the
          # observability one for the Alertmanager that sends it. P01 needs one to exist.
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          for ns in hephaisto hephaisto-obs; do
            kubectl -n $ns create secret generic hephaisto-webhook-token --from-literal=token="$TOKEN"
          done

      - uses: docker/setup-buildx-action@v4

      - name: Build the agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: hephaisto/agent:e2e
          load: true
          build-args: |
            VERSION=${{ needs.version.outputs.semver }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=linux/amd64

      - name: Build the stand-in image
        run: docker build -q -f infra/e2e/notification-receiver/Dockerfile -t hephaisto/notification-receiver:dev .

      - name: Load both into kind
        run: |
          kind load docker-image hephaisto/agent:e2e --name hephaisto-e2e
          kind load docker-image hephaisto/notification-receiver:dev --name hephaisto-e2e

      - name: The stand-in and an Alertmanager
        run: |
          kubectl apply -f infra/e2e/teams-stand-in.yaml
          kubectl apply -f infra/e2e/alertmanager.yaml
          # The pod whose log is an instruction (P33, P41), and the MCP tokens values-pager.yaml
          # names (#157) - random, made here, masked below.
          kubectl apply -f infra/e2e/pager-fixture.yaml
          scripts/e2e/mcp-secrets.sh --context kind-hephaisto-e2e --namespace hephaisto
          kubectl -n hephaisto-obs rollout status deploy/teams-stand-in --timeout=120s
          kubectl -n hephaisto-obs rollout status deploy/pager-alertmanager --timeout=120s

      - name: helm install, as the pager suite runs it
        run: |
          helm install hephaisto \
            "/tmp/chart/hephaisto-${{ needs.version.outputs.semver }}.tgz" \
            --namespace hephaisto \
            -f scripts/e2e/values-pager.yaml \
            -f scripts/e2e/values-mcp.yaml \
            --set cluster.name=pager-e2e \
            --set secrets.webhookToken=hephaisto-webhook-token \
            --set image.repository=hephaisto/agent \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set postgres.embedded.enabled=true \
            --set prometheusOperator.selectorLabels.release=kube-prometheus-stack \
            --wait --timeout 6m

      # A second, small agent with sign-in on and a gateway's static token beside it, against the
      # identity-provider stand-in - how production runs the MCP endpoint (#157, P48).
      - name: The sign-in install
        run: |
          scripts/e2e/signin-install.sh --context kind-hephaisto-e2e \
            --chart "/tmp/chart/hephaisto-${{ needs.version.outputs.semver }}.tgz" \
            --image hephaisto/agent:e2e

      - name: The pager suite
        run: |
          set -uo pipefail
          kubectl -n hephaisto port-forward svc/hephaisto 18080:8080 >/tmp/pf-agent.log 2>&1 &
          kubectl -n hephaisto-obs port-forward svc/teams-stand-in 18110:8080 >/tmp/pf-standin.log 2>&1 &
          kubectl -n hephaisto-obs port-forward svc/pager-alertmanager 19093:9093 >/tmp/pf-am.log 2>&1 &
          kubectl -n hephaisto port-forward svc/hephaisto 18083:8083 >/tmp/pf-mcp.log 2>&1 &
          kubectl -n hephaisto-signin port-forward svc/hephaisto-signin 18283:8083 >/tmp/pf-signin.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 2
            curl -sf localhost:18080/healthz >/dev/null && curl -sf localhost:18110/healthz >/dev/null && break
          done
          # A pod the suite deletes (P15) takes its port-forward with it; this keeps one open.
          ( while sleep 5; do
              curl -sf --max-time 3 localhost:18080/healthz >/dev/null \
                || kubectl -n hephaisto port-forward svc/hephaisto 18080:8080 >>/tmp/pf-agent.log 2>&1 &
              curl -s -o /dev/null --max-time 3 localhost:18083/mcp \
                || kubectl -n hephaisto port-forward svc/hephaisto 18083:8083 >>/tmp/pf-mcp.log 2>&1 &
            done ) &
          export PAGER_API=http://localhost:18080 PAGER_HOOK=http://localhost:18080
          export PAGER_STANDIN=http://localhost:18110 PAGER_AM=http://localhost:19093
          export PAGER_CAPS="am kubectl spare-agent mcp signin"
          export PAGER_SIGNIN_MCP=http://localhost:18283/mcp
          eval "$(scripts/e2e/signin-install.sh --context kind-hephaisto-e2e --print)"
          echo "::add-mask::$PAGER_SIGNIN_STATIC"
          export PAGER_MCP=http://localhost:18083/mcp
          eval "$(scripts/e2e/mcp-secrets.sh --context kind-hephaisto-e2e --namespace hephaisto --print)"
          for v in READER APPROVER ONCALL SHARED READONLY; do
            t="PAGER_MCP_TOKEN_$v"; echo "::add-mask::${!t}"
          done
          PAGER_TOKEN=$(kubectl -n hephaisto get secret hephaisto-webhook-token -o jsonpath='{.data.token}' | base64 -d)
          export PAGER_TOKEN
          export E2E_KUBECONFIG="$HOME/.kube/config" E2E_CONTEXT=kind-hephaisto-e2e
          scripts/e2e/pager.sh --results /tmp/pager-results

      - name: The suite's results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pager-results
          path: /tmp/pager-results
          if-no-files-found: ignore

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n hephaisto get all
          kubectl -n hephaisto logs -l app.kubernetes.io/name=hephaisto --tail=300 --all-containers || true
          kubectl -n hephaisto-obs logs deploy/teams-stand-in --tail=200 || true
          kubectl -n hephaisto-obs logs deploy/pager-alertmanager --tail=100 || true
          cat /tmp/pf-mcp.log || true
          kubectl -n hephaisto-signin logs deploy/hephaisto-signin --tail=100 || true

  # The safety net for the stylesheet. Nothing else in this workflow can see a visual
  # regression: the console suite asserts behaviour against a live agent, and every one of its
  # Both generated sites must still build.
  #
  # Until v0.6.0 there was nothing to build - website/ is hand-written HTML and what is committed
  # is what is served, which is why pages.yml carried no build step and said so. The docs site and
  # the demo site changed that, and neither fails in a way a reviewer would notice by reading the
  # diff:
  #
  #   - the docs transclude eleven runbooks, four prompts, values.yaml, architecture.md and
  #     CHANGELOG.md from where they actually live. A moved or renamed file does not error, it
  #     renders a blank section. ignoreDeadLinks is false so a link into the repo that stopped
  #     resolving fails the build, which is the whole point of keeping the docs in the repository.
  #   - the demo site parses the domain enums out of Enums.cs and refuses to render if a member
  #     was renamed, and refuses again if any transcript still contains an unredacted address.
  #
  # So this is a correctness gate on the docs, not a packaging step. It holds no credential and
  # deploys nothing - that is deploy.yml, on main only.
  sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # bun, not npm - and only here. The visual job below runs inside the pinned Playwright
      # image, which ships node and NOT bun, so design/visual/ and scripts/e2e/ui/ stay on npm:
      # installing bun into that image per run would cost time and weaken the thing the pin
      # exists for, which is byte-identical rendering behind maxDiffPixels: 0.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: the docs build, and every transclusion still resolves
        working-directory: docs-site
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: the demo renders from the committed transcripts
        working-directory: demo-site
        run: bun run build

      # A build that emitted nothing exits 0. Assert it produced pages, the same way
      # visual-test.sh asserts the suite actually compared something.
      - name: both produced pages
        run: |
          set -euo pipefail
          test -s docs-site/.vitepress/dist/index.html
          test -s demo-site/dist/index.html
          pages=$(find demo-site/dist/i -name '*.html' | wc -l)
          test "$pages" -ge 12 || { echo "only $pages demo pages rendered"; exit 1; }
          echo "docs ok, $pages demo pages"

  # assertions passes just as happily against a console whose layout has collapsed.
  #
  # Runs INSIDE the pinned Playwright image rather than installing browsers on the runner,
  # because that image is also what scripts/visual-test.sh uses locally. Font rasterisation is
  # not portable, so one platform produces the baselines and compares them - otherwise CI fails
  # on antialiasing and people learn to re-baseline past it.
  #
  # No cluster, no agent, no database: the subject is design/gallery.html over file://.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      # The script asserts the run actually compared something, the same way ui/run.sh does -
      # playwright exits 0 when everything skipped, and a visual suite that quietly stopped
      # running looks exactly like one that passed.
      - run: scripts/visual-test.sh

      - name: The diff, when there is one
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: design/visual/test-results/
          retention-days: 7

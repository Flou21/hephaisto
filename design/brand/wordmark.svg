<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 40" role="img" aria-label="Hephaisto">
  <!--
    The lockup: mark plus wordmark. The word is Archivo 700, the console's display face, and the
    trailing period is the accent - a full stop, because the agent's claim is that it finishes
    things or says who has to.

    THE WORD CARRIES BOTH THEMES. The first version of this file hardcoded the dark-theme
    foreground and was invisible on a light page, which is the same defect the token set exists
    to prevent - caught here by the light-mode baseline rather than by a person. An SVG loaded
    through <img> is an isolated document, so `currentColor` inherits nothing; a media query
    inside the file is what makes one asset work on both grounds.
  -->
  <style>
    .word { fill: #e4e1db; }
    @media (prefers-color-scheme: light) { .word { fill: #1c1a17; } }
  </style>
  <rect x="4" y="4" width="32" height="32" rx="6" fill="#1b1e24"/>
  <path d="M20 9.2 L31.4 30.2 L25.6 30.2 L20 19.6 L14.4 30.2 L8.6 30.2 Z" fill="#ff8a3d"/>
  <text x="48" y="28" class="word" font-family="Archivo, ui-sans-serif, system-ui, sans-serif"
        font-size="24" font-weight="700" letter-spacing="0.5">hephaisto<tspan fill="#ff8a3d">.</tspan></text>
</svg>

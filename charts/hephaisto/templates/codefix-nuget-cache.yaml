{{- if and .Values.codeFix.enabled .Values.codeFix.nugetCache.enabled }}
{{/*
The NuGet package cache shared by coder Jobs, mounted at /work/nuget/packages (NUGET_PACKAGES in
the coder image). A cold restore is 2-4 minutes of every attempt's deadline; this makes the
second attempt against a repository start warm.

ReadWriteOnce, so two coder Jobs on different nodes cannot both mount it - which is one reason
codeFix.budgets.concurrentJobs defaults to 1.

OFF BY DEFAULT, because it is the one thing that outlives an attempt. Every other thing a coder
touches is an emptyDir that dies with its pod; this survives, and a NuGet package can carry
MSBuild targets that the NEXT attempt's restore and build execute - the restore in a container
that holds the GitHub and NuGet tokens.

Since v0.13.0 the Job mounts it writable only into `prepare`, whose restore is of the untouched
default branch and runs before the model exists, and READ-ONLY into `coder`, where the model
and the build of what it wrote run. So the model's container cannot put anything here for a
later attempt to execute. What is left is what a mapped repository's own default branch restores.

No credential is ever written here (a nuget.config holds %placeholders%, never a token).

Hephaisto holds no delete on PVCs anywhere, and this one outlives `helm uninstall` only if you
annotate it to - by default Helm removes it with the release.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hephaisto.codeFixNugetClaim" . }}
  namespace: {{ include "hephaisto.codeFixNamespace" . }}
  labels:
    {{- include "hephaisto.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.codeFix.nugetCache.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.codeFix.nugetCache.size }}
{{- end }}

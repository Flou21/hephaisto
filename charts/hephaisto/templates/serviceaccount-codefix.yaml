{{- if .Values.codeFix.enabled }}
{{/*
The coder's ServiceAccount. It exists for ONE reason: so the coder pod does not run as the
namespace's `default` ServiceAccount, which somebody may have bound to something.

It is bound to NOTHING, and must stay that way. The coder is a model holding a shell that has
just read evidence derived from workload logs - attacker-influenceable text. Whatever this
identity could do, a prompt injection could make it do. So it can do nothing: no Role or
ClusterRole names it (negative-tests.sh fails the build if one ever does), and its token is
never mounted - here, and again on the pod in CodeFixJobSpec, so neither half alone is the
control.

The egress proxy runs as it too, for the same reason and with the same absence of a token.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hephaisto.codeFixServiceAccountName" . }}
  namespace: {{ include "hephaisto.codeFixNamespace" . }}
  labels:
    {{- include "hephaisto.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

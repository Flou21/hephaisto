{{- if .Values.networkPolicy.enabled }}
{{/*
=========================================================================================
The NetworkPolicy IS the webhook's authentication
=========================================================================================
The Alertmanager receiver is unauthenticated - Alertmanager cannot send credentials to a
receiver, so there is no header to check. An unauthenticated endpoint that CREATES INCIDENTS
and can trigger REMEDIATION is a forged-alert injection point: anything able to POST to it can
make the agent believe a workload is broken and, in Auto mode, act on it.

So the mitigation is at the network layer, and this policy is not a hardening extra - it is
the control. Remember that NetworkPolicy `from:` rules are OR'd: every entry below widens the
set of things that can forge an alert.

ALSO: your cluster must actually enforce NetworkPolicy. Many CNIs (kind's default among them)
accept these objects and ignore them, in which case this file is documentation rather than a
control, and the only remaining protection is that the cluster is trusted.
=========================================================================================
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hephaisto.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hephaisto.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hephaisto.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    # Alertmanager's webhooks and Prometheus's scrape. Selecting the NAMESPACE rather than
    # specific pods is deliberate: Alertmanager and Prometheus pod labels are chart-managed
    # and change across upgrades, and a policy that breaks on a `helm upgrade` would cut the
    # agent off from its alert feed silently.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observabilityNamespace }}
      ports:
        - protocol: TCP
          port: 8080

    # Within the namespace: the agent to its own Postgres, and any future sidecar.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5432

    {{- if .Values.networkPolicy.extraIngressCIDRs }}
    # Kubelet probes arrive from the NODE's address, which no namespaceSelector can match, so
    # on some clusters the liveness probe fails without an entry here and the pod is killed in
    # a loop by its own protection. This is the single most common way a first NetworkPolicy
    # breaks a working service.
    #
    # Every CIDR here can forge an alert. Prefer the node CIDR over 0.0.0.0/0.
    - from:
        {{- range .Values.networkPolicy.extraIngressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
{{- if .Values.networkPolicy.egress.enabled }}
  {{/*
  =======================================================================================
  Egress - every line here is something the agent stops being able to do if it is wrong
  =======================================================================================
  The ingress rules above restrain what can reach the agent. These restrain what the agent
  can reach, so a missing entry is not a weakened control - it is an outage. And it is a
  quiet one: the pod starts, passes its probes, reports healthy, and silently cannot watch
  pods or call a model.

  Ordered by how badly its absence breaks things.
  =======================================================================================
  */}}
  egress:
    {{- if .Values.networkPolicy.egress.dns }}
    # DNS, to anywhere. CoreDNS is in kube-system on most clusters and somewhere else on
    # enough of them that a namespaceSelector here is how this breaks on the cluster nobody
    # tested. Port 53 to the world is not a meaningful widening.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}

    {{- with .Values.networkPolicy.egress.apiServerCIDRs }}
    # The Kubernetes API server. Not selectable - it is an endpoint, usually the
    # control-plane address or a load balancer outside the cluster - so it has to be a CIDR.
    # Without this the agent cannot watch, cannot read events and cannot act.
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $.Values.networkPolicy.egress.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}

    # Its own namespace: Postgres, and anything else alongside. "No audit, no action" means
    # losing this does not degrade the agent, it stops the executor outright.
    - to:
        - podSelector: {}

    # The observability stack: OTLP, grafana-mcp, Grafana's annotation API, Prometheus.
    # Selecting the namespace rather than pods, for the reason the ingress rules give -
    # chart-managed pod labels change across upgrades.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observabilityNamespace }}

    {{- with .Values.networkPolicy.egress.extraEgressCIDRs }}
    # Outside the cluster: the LLM API, and wherever the notification channels point. This is
    # the one that has to be widened before an escalation can reach a person.
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $.Values.networkPolicy.egress.extraEgressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.postgres.embedded.enabled }}
---
# Postgres accepts connections only from inside this namespace. It is deliberately not exposed
# to the observability stack: that stack has no business reading the agent's incident history,
# and the agent's memory is not a telemetry source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hephaisto.fullname" . }}-postgres-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hephaisto.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hephaisto.fullname" . }}-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- end }}

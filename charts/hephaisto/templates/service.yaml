apiVersion: v1
kind: Service
metadata:
  name: {{ include "hephaisto.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hephaisto.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hephaisto.selectorLabels" . | nindent 4 }}
  ports:
    # Alertmanager posts here: /webhooks/alertmanager and /webhooks/watchdog.
    # Outside OIDC - Alertmanager cannot sign in - and protected by the bearer token in
    # secrets.webhookToken when set, and by the NetworkPolicy.
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    {{- if .Values.webhookPort }}
    - name: webhook
      port: {{ .Values.webhookPort }}
      targetPort: webhook
      protocol: TCP
    {{- end }}
    {{- with include "hephaisto.teamsActionsPort" . }}
    # Microsoft posts clicks here, authenticated by a Bot Framework token. Point the Azure Bot's
    # messaging endpoint at an ingress for THIS port only.
    - name: teams-actions
      port: {{ . }}
      targetPort: teams-actions
      protocol: TCP
    {{- end }}
    {{- with include "hephaisto.mcpPort" . }}
    # The MCP endpoint (#157). A gateway registers http://<this service>:{{ . }}/mcp.
    - name: mcp
      port: {{ . }}
      targetPort: mcp
      protocol: TCP
    {{- end }}
    {{- with include "hephaisto.investigatorPort" . }}
    # The investigator port (v0.12.0 F5). Only investigator Jobs call it, at
    # http://<this service>:{{ . }}/investigate, each with its own run's token.
    - name: investigator
      port: {{ . }}
      targetPort: investigator
      protocol: TCP
    {{- end }}

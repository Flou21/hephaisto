apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hephaisto.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hephaisto.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent calls the Kubernetes API on every investigation, so it needs its token. What
# bounds it is the ClusterRole, which has no write verbs and no access to Secrets at all.
automountServiceAccountToken: true

apiVersion: v2
name: hephaisto
description: An autonomous SRE agent that investigates Kubernetes incidents and reports what it found.
type: application
home: https://hephaisto.dev
sources:
  - https://github.com/Flou21/hephaisto
# Artifact Hub renders this beside the chart, and it was blank for four releases because the
# repository contained no image to point at. Raw GitHub rather than a site URL: the site is not
# deployed yet, and a chart icon that 404s is worse than the blank tile it replaced.
icon: https://raw.githubusercontent.com/Flou21/hephaisto/main/design/brand/mark.svg

# Artifact Hub shows this on the chart tile. A URL rather than an email address: the address
# would be published into every chart index that mirrors this one, and a profile link reaches
# the same person without doing that.
maintainers:
  - name: Flou21
    url: https://github.com/Flou21

annotations:
  # Artifact Hub surfaces the licence from here. Worth setting explicitly: a chart that
  # installs an AGPL program should say so where someone browsing charts will see it.
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/links: |
    - name: source
      url: https://github.com/Flou21/hephaisto
    - name: documentation
      url: https://docs.hephaisto.dev
    - name: demo
      url: https://demo.hephaisto.dev
    - name: support
      url: https://github.com/Flou21/hephaisto/issues
keywords:
  - sre
  - kubernetes
  - observability
  - incident-response
  - ai-agent

# STAYS 0.0.0 IN GIT, FOREVER.
#
# CI stamps the real number at package time:
#
#     helm package charts/hephaisto --version "$SEMVER" --app-version "$SEMVER"
#
# which overrides both without writing to this file. That is what keeps a release to a single
# `git tag v0.0.1` with no bump commit and no CI push back to main - and it is why
# ci/negative-tests.sh asserts these two still read 0.0.0. If someone "helpfully" sets a real
# version here, the tag and the chart become two sources of truth that drift.
version: 0.0.0
appVersion: "0.0.0"

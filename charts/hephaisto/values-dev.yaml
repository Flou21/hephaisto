# Overrides for THIS repo's dev cluster (k3s under Rancher Desktop). Not an example to copy:
# two of these values are actively unsafe anywhere else, and say so.

image:
  repository: hephaisto/agent
  tag: dev
  # The image is built straight into the node's docker daemon; there is no registry to pull
  # from, so Always would fail on a tag that only exists locally.
  pullPolicy: IfNotPresent

observabilityNamespace: hephaisto-obs

# This cluster's kube-prometheus-stack release is named `hephaisto`, so its selectors look for
# release=hephaisto. This is exactly the value that is right here and wrong everywhere else.
prometheusOperator:
  selectorLabels:
    release: hephaisto

# The one namespace on this cluster that contains nothing anyone depends on.
policy:
  actionableNamespaces:
    - hephaisto-chaos

  # Pre-approved here so that `mode` is the ONLY thing left to change. Flipping DryRun -> Auto
  # in this file is then a single, reviewable, revertible line - which is the whole operating
  # model: the dials live in git, and the database arm can lower the mode but never raise it.
  autoEnabledActionTypes:
    - RestartPod

# DryRun: the entire flow runs, every Kubernetes call is made with dryRun=All, the API server
# validates it and discards it. That produces the would-have-acted log - real admission rows,
# real budget accounting, real audit trail, and nothing changed in the cluster - which is the
# evidence worth reading before turning autonomy on. Raise to Auto when you have read it.
mode: DryRun

otel:
  endpoint: http://otel-collector.hephaisto-obs:4318
  protocol: http/protobuf
  environment: studio-rancher-desktop

grafanaMcp:
  url: http://grafana-mcp.hephaisto-obs:8000/mcp

postgres:
  embedded:
    enabled: true
    storage: 10Gi

alerts:
  # On here, and only here: these assert facts about THIS collector topology, and would fire
  # permanently on any other stack - and then be fed to the agent as incidents.
  observabilitySelfcheck: true

networkPolicy:
  enabled: true
  # UNSAFE AS A GENERAL DEFAULT, and deliberately not in values.yaml. On this node the kubelet
  # probes arrive from an address no namespaceSelector can match, so without this the liveness
  # probe fails and the pod is killed in a loop by its own protection. The cost is that any
  # pod in this cluster can post a forged alert - acceptable only because this cluster is
  # single-tenant and reachable from one private network.
  extraIngressCIDRs:
    - 0.0.0.0/0

# FALSE only because Tilt runs the DEV image, whose entrypoint is `dotnet watch` - a compiler.
# It has to write build output, a NuGet cache and a CLI home; with a read-only root it fails at
# startup with `Read-only file system : '/app/src/Hephaisto.Core/obj/Debug'`, which reads like a
# permissions bug and is actually a design mismatch. The published image needs none of this, so
# the chart default stays true.
securityContext:
  readOnlyRootFilesystem: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    # 3Gi, not the chart's 1Gi, for the same reason as above: this container is running the
    # .NET SDK and Roslyn, not just the app. At 1Gi it is OOM-killed (exit 137) within about
    # ninety seconds of every hot reload, and the restart looks like an application crash
    # rather than a sizing mistake.
    memory: 3Gi

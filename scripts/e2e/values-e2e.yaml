# Chart values for the throwaway kind cluster.
#
# Derived from values-dev.yaml, and the differences are the point rather than incidental:
#
#   * `image` is NOT set. Left alone it resolves to ghcr.io/flou21/hephaisto:<appVersion>,
#     which is the PUBLISHED image for the version under test. values-dev.yaml overrides it
#     to a locally built hephaisto/agent:dev, and an e2e that installs a local build proves
#     nothing about what was published.
#
#   * readOnlyRootFilesystem stays TRUE. values-dev.yaml turns it off because `dotnet watch`
#     needs to write; the published image does not, and the production posture is the one
#     worth testing. Nothing else in this repo exercises it.
#
#   * networkPolicy.extraIngressCIDRs is NOT widened to 0.0.0.0/0 as values-dev.yaml does.
#     kind's default CNI does not enforce NetworkPolicy at all, so widening it would change
#     nothing except to hide the fact that the policy is unenforced here. See the harness's
#     summary, which says so out loud.
#
#   * extraEnv caps spend. Investigations here are real Gemini calls against a real key.

observabilityNamespace: hephaisto-obs

# Must match the kube-prometheus-stack release name the harness installs (`hephaisto`), or
# every PodMonitor and PrometheusRule is created successfully and selected by nothing.
prometheusOperator:
  selectorLabels:
    release: hephaisto

policy:
  actionableNamespaces:
    - hephaisto-chaos

  # THE ROLLBACK WINDOWS, SHORTENED FOR THE HARNESS. Read this before copying it anywhere.
  #
  # The shipped defaults are 30m and 1h. The one-hour minimum cannot be met on a cluster kind
  # created twenty minutes ago, so with the defaults NO rollback fixture could ever be admitted
  # here - the policy engine would refuse c14 for an entirely correct reason and the run would
  # look like a failure of the executor.
  #
  # This is the same reasoning that makes the shipped alert rules use `for: 2m` where upstream
  # uses 15m: the harness runs on a timescale the production defaults were not written for.
  #
  # It is a deliberate split of what is tested where. THE GATE is exercised by
  # PolicyEngineTests, which constructs any revision age it likes in microseconds and asserts
  # the boundary in both directions. THIS FIXTURE exercises the PIPELINE - detect, correlate,
  # propose, admit, execute, verify, resolve. Shortening the windows does not weaken the gate's
  # test, because the gate is not what a chaos run measures.
  #
  # previousHealthyMinimum must stay BELOW C14_DWELL in scripts/e2e/lib/chaos.sh (300s), or
  # the fixture arms itself into a refusal.
  rollbackPreviousHealthyMinimum: "00:03:00"

  # Widened rather than shortened, and for a different reason: the current revision has to
  # still be "fresh" when the plan is JUDGED, not when the alert fires. Between the two sit a
  # 5-minute rate window, Alertmanager's group wait, and a full investigation. Thirty minutes
  # is comfortable in production and tight here.
  rollbackFreshRevisionWindow: "02:00:00"

# Observe: detect, investigate, report, mutate nothing. The harness asserts that no action
# was executed, which is only a meaningful assertion in a mode where one could have been.
mode: Observe

otel:
  endpoint: http://otel-collector.hephaisto-obs:4318
  protocol: http/protobuf
  environment: kind-e2e

grafanaMcp:
  url: http://grafana-mcp.hephaisto-obs:8000/mcp

# Grafana's own API, for incident annotations. The release name for kube-prometheus-stack in
# this harness is `hephaisto`, so its Grafana Service is hephaisto-grafana. The token comes
# from the hephaisto-grafana-annotation Secret that bootstrap-secrets.sh mints - an Editor
# service account, separate from grafana-mcp's Admin one.
grafana:
  url: http://hephaisto-grafana.hephaisto-obs

postgres:
  embedded:
    enabled: true
    # Smaller than dev's 10Gi. The cluster lives for one run, and a kind node's disk is the
    # Lima VM's disk.
    storage: 2Gi

alerts:
  kubernetes: true
  slo: true
  watchdog: true
  # The self-check rules, including the two budget rules that could not fire until
  # hephaisto_llm_budget_utilization was actually emitted. Verifying those is part of why
  # this harness exists, so they are on here and off in the chart's default.
  observabilitySelfcheck: true

dashboard:
  enabled: true

networkPolicy:
  enabled: true

# -------------------------------------------------------------------------------------------
# Spend control
# -------------------------------------------------------------------------------------------
# Without these the C# defaults apply - $3/hour, $20/day, $0.50/incident - which are sized for
# a real deployment, not for a test that can be re-run twenty times in an afternoon while
# someone debugs the harness itself.
#
# The per-incident cap is the one that should bind: it is what stops a single runaway
# investigation, and $0.10 is comfortably above the ~$0.08 mean.
#
# The hourly cap was $1.00, sized when a run meant FOUR fixtures. The eight-fixture run spends
# about $0.88 on the chaos incidents alone and then keeps going - the cluster opens a dozen
# incidents of its own while it settles - so the hour cap started binding instead of backstopping
# and HephaistoLlmBudgetExhausted fired mid-run. A cap that stops a legitimate run is not a
# safety limit, it is a broken test: the investigations it cuts short are reported as the agent
# failing to produce a finding.
#
# Raised to leave headroom for the widest fixture set while still bounding a loop. If a run ever
# approaches $3 something is genuinely wrong, which is what the cap is for.
extraEnv:
  # The token ceiling, raised because it - not the cost cap - is what binds on a cheap model.
  #
  # Measured on the first full Auto run: 27 investigations, 14 of them refused outright with
  # TerminationReason.Cancelled and the incidents escalated BudgetExhausted, at a total spend of
  # $0.066 against a $3.00 hourly cost cap. Nothing was close to the money. What ran out was
  # MaxTokensPerHour, which defaults to 2,000,000 - and 2M tokens of gpt-oss-120b costs about
  # six cents, so the two ceilings are calibrated for price points ~45x apart.
  #
  # The caps below were written for gemini-3.7-flash at $0.75/1M. On a model at $0.03/1M the
  # cost cap is unreachable and the token cap is the whole budget, which is how a full-corpus
  # run lost half its investigations without spending anything. 20M keeps a real bound and
  # restores cost as the ceiling that governs.
  - name: Llm__Budget__MaxTokensPerHour
    value: "20000000"
  - name: Llm__Budget__MaxCostUsdPerIncident
    value: "0.10"
  - name: Llm__Budget__MaxCostUsdPerHour
    value: "3.00"
  - name: Llm__Budget__MaxCostUsdPerDay
    value: "6.00"

  # The outbound cooldown has no first-class value - the chart exposes the settings you cannot
  # run without and leaves the tuning knobs to extraEnv, which is the same line the budget caps
  # sit on. Fifteen minutes is right in production and would swallow the second half of a
  # twenty-minute run's assertions.
  - name: Notifications__CorrelationCooldown
    value: "00:00:30"

# -------------------------------------------------------------------------------------------
# Outbound notifications
# -------------------------------------------------------------------------------------------
# webhook.url must match RECEIVER_URL in scripts/e2e/lib/notify.sh, or the agent delivers
# nowhere and every assertion in the notify phase fails for a reason that has nothing to do
# with the agent.
#
# signed is FALSE here and the assertion for signing is skipped accordingly - the signing key
# is a secretKeyRef and the chart has no Secret template, so turning it on would mean minting
# another Secret in deps_secrets for a property already covered by unit tests. What this
# harness is here to prove is that the message survives a restart.
notifications:
  # The forwarded address, because that is where the harness itself reaches the console - so a
  # link in a delivered message is one this run could actually follow.
  baseUrl: "http://127.0.0.1:18100"
  webhook:
    url: "http://notification-receiver.hephaisto-obs:8080/hooks/hephaisto"
    signed: false
  routes:
    # Everything, to the one channel. A narrower table would be testing the routing rules
    # rather than the delivery path, and the routing rules already have unit tests.
    - channel: webhook
      events:
        - IncidentEscalated
        - VerificationFailed
        - ApprovalRequired
        - IncidentResolved
        - ModeChanged
        - PolicyChanged

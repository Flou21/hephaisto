# The agent as the pager suite runs it (scripts/e2e/pager.sh).
#
# Layered over the install's own values: values-dev.yaml on the dev cluster (tilt_config.json
# "pager-e2e": true), the CI job's --set lines on kind, values-e2e.yaml in the release harness.
# It changes three things and nothing else:
#
#   1. The model is the stand-in (infra/e2e/notification-receiver/LlmStandIn.cs): every
#      investigation concludes at once, the same way, for $0 - or when a scenario says so.
#   2. Teams is the stand-in, and so is the outbound webhook's receiver: what a person would have
#      seen is read back from GET /teams/messages and GET /received.
#   3. Every window a scenario has to wait out is seconds: a repeat past the burst and
#      correlation windows, a re-fire past the reopen window, a step nobody answered.
#
# Hours in production and seconds here is a real difference, and the suite relies on nothing
# but the ordering of the windows: repeat > correlation > burst, reopen > everything a scenario
# does inside it.
#
# extraEnv is the WHOLE list - Helm replaces lists - so anything a lower layer put there is gone.
# The Tiltfile knows, and neither layers values-dev-local-llm.yaml nor appends the Teams
# stand-in's addresses when this file is in play: both are here.
extraEnv:
  # 1. The model.
  - name: Llm__Provider
    value: openai
  - name: Llm__Endpoint
    value: http://model-stand-in.hephaisto-obs:8080/v1
  - name: Llm__Model
    value: stand-in
  - name: Llm__EmbeddingProvider
    value: openai
  - name: Llm__EmbeddingEndpoint
    value: http://model-stand-in.hephaisto-obs:8080/v1
  - name: Llm__EmbeddingModel
    value: stand-in
  # 2. Teams, where the bot logs in and where it posts. No chart value on purpose: nobody but a
  # test harness should move these.
  - name: Notifications__TeamsBot__LoginUrl
    value: http://teams-stand-in.hephaisto-obs:8080
  - name: Notifications__TeamsBot__ServiceUrl
    value: http://teams-stand-in.hephaisto-obs:8080/teams
  - name: Notifications__TeamsBot__RefreshInterval
    value: "00:00:05"
  # P26: the buttons trust the stand-in's published keys instead of Microsoft's, over plain HTTP.
  - name: Notifications__TeamsBot__Actions__OpenIdMetadataUrl
    value: http://teams-stand-in.hephaisto-obs:8080/teams/openid/.well-known/openidconfiguration
  - name: Notifications__TeamsBot__Actions__RequireHttpsMetadata
    value: "false"
  # 3. The windows.
  - name: Ingest__BurstWindow
    value: "00:00:20"
  - name: Ingest__CorrelationWindow
    value: "00:00:30"
  - name: Ingest__FlapWindow
    value: "00:03:00"
  - name: Ingest__ReopenWindow
    value: "00:02:00"
  - name: Notifications__CorrelationCooldown
    value: "00:00:20"
  - name: Notifications__DispatchInterval
    value: "00:00:02"
  - name: Notifications__FirstRetryDelay
    value: "00:00:05"
  - name: Notifications__UnansweredInterval
    value: "00:00:05"
  # P49: the open watcher incidents are compared with their workloads this often.
  - name: Kubernetes__HealedCheckInterval
    value: "00:00:05"

# P49: a workload is healed after seconds. Above the ten seconds a first crash-loop back-off
# lasts, which is all the scenario's own container ever waits.
incidents:
  healedAfter: "00:00:20"

# Priced at zero, explicitly: a cost cap with an unpriced model refuses to start (#140), and the
# stand-in costs nothing.
llm:
  pricing:
    - model: stand-in
      inputPerMillionUsd: 0
      outputPerMillionUsd: 0

notifications:
  maxPerChannelPerHour: 1000
  # In-cluster, because nothing here is opened by a person. Links only have to be well-formed.
  baseUrl: http://hephaisto.hephaisto:8080
  webhook:
    url: http://teams-stand-in.hephaisto-obs:8080/hooks/hephaisto
  teamsBot:
    enabled: true
    # Made up, like every id in the stand-in: it checks the shape of a request, not who sent it.
    tenantId: 00000000-0000-0000-0000-0000000000d1
    appId: 00000000-0000-0000-0000-0000000000d2
    channelId: "19:pager-suite@thread.tacv2"
    teamId: 00000000-0000-0000-0000-0000000000d3
    recipients:
      - oncall@example.com
    board:
      maxIncidents: 40
    actions:
      enabled: true
      # P52, P53: who may close from a card. The object id the stand-in gives oncall@example.com
      # (TeamsStandIn.ObjectId: the first 16 bytes of the address's SHA-256, as a GUID; a unit
      # test, PagerSuiteTests, recomputes it). dev@ and lead@ are members and not approvers.
      approvers:
        - 6bc676d8-34ad-8cef-60ff-07a371204c78
  # The routing the scenarios read (P22-P25): team=pager-a and team=pager-b to oncall@, a
  # critical from team=pager-b to lead@ as well, and everything no team owns to dev@ through the
  # fallback. The webhook route is unscoped and hears everything.
  routes:
    - name: team-a
      channel: teamsBot
      events: [IncidentOpened, IncidentEscalated, ApprovalRequired, VerificationFailed, IncidentResolved]
      matchers:
        - label: team
          values: [pager-a]
      recipients: [oncall@example.com]
      # P23, P24: unacknowledged for 30 seconds, lead@ is told too.
      steps:
        - after: "00:00:30"
          recipients: [lead@example.com]
    - name: team-b
      channel: teamsBot
      events: [IncidentOpened, IncidentEscalated, ApprovalRequired, VerificationFailed, IncidentResolved]
      matchers:
        - label: team
          values: [pager-b]
      recipients: [oncall@example.com]
    - name: team-b-critical
      channel: teamsBot
      events: [IncidentOpened, IncidentEscalated, ApprovalRequired, VerificationFailed, IncidentResolved]
      minSeverity: Critical
      matchers:
        - label: team
          values: [pager-b]
      recipients: [lead@example.com]
    - name: nobody-else
      channel: teamsBot
      fallback: true
      events: [IncidentOpened, IncidentEscalated, ApprovalRequired, VerificationFailed, IncidentResolved]
      recipients: [dev@example.com]
    - name: outbound
      channel: webhook
      events: [IncidentOpened, IncidentEscalated, ApprovalRequired, VerificationFailed, IncidentResolved, ModeChanged]

secrets:
  notificationTeamsBot: hephaisto-notification-teams-bot-stand-in

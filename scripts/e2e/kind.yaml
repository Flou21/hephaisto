# The throwaway cluster the e2e harness builds and destroys on every run.
#
# SINGLE NODE, and that is a correctness requirement rather than a saving.
# infra/chaos/README.md writes its expected Kubernetes events against a one-node cluster -
# C3's is literally "0/1 nodes are available: 1 Insufficient memory." Add a worker and that
# fixture's assertion, and the agent's diagnosis of it, both change.
#
# Deliberately NO kubeadmConfigPatches removing the control-plane taint. kind already does
# that itself when a cluster has no worker nodes, and doing it here first makes kind's own
# step fail the whole create:
#
#   ERROR: failed to remove control plane taint: ...
#   error: taint "node-role.kubernetes.io/control-plane" not found
#
# which reads like a kind bug rather than a config that did the job twice.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hephaisto-e2e
nodes:
  - role: control-plane
